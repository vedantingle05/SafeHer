name: safeher
description: SafeHer - AI-Based Personal Safety Monitoring System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  smooth_page_indicator: ^1.1.0

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.1.0
  dio: ^5.3.3
  http_parser: ^4.0.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Authentication
  supabase_flutter: ^2.5.0
  app_links: ^6.0.0

  # Sensors
  sensors_plus: ^4.0.2
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  camera: ^0.10.5+7

  # Audio
  flutter_sound: ^9.2.13
  permission_handler: ^11.1.0

  # AI/ML
  tflite_flutter: ^0.11.0

  # Firebase (all optional — app works without it)
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.6
  firebase_storage: ^11.5.6

  # Maps & URLs
  google_maps_flutter: ^2.5.3
  url_launcher: ^6.2.1

  # Image processing
  image: ^4.1.3

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.1
  uuid: ^4.2.1
  image_picker: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
    - assets/sounds/
